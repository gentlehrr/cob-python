[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cob-farm"
version = "0.1.1"
description = "Official Python SDK for the COB API (cob.farm): silo document intelligence with cited answers"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "PHOROS AI" }]
dependencies = ["requests>=2.25"]
keywords = ["rag", "document-intelligence", "retrieval", "cob", "phoros"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://cob.farm"
Documentation = "https://cob.farm/#/docs"

[tool.setuptools.packages.find]
include = ["cob*"]
